<a class="post-card" href="{{ .Permalink }}">
  <div class="post-card-top">
    <span class="post-card-section">{{ .Section }}</span>
    <time class="post-card-date">{{ .Date.Format "2006-01-02" }}</time>
  </div>
  <h3 class="post-card-title">{{ .Title }}</h3>
  {{ with .Params.subtitle }}<p class="post-card-subtitle">{{ . }}</p>{{ end }}
  {{ with .Summary }}<p class="post-card-excerpt">{{ . | plainify | truncate 120 }}</p>{{ end }}
  <div class="post-card-tags">
    {{ range .Params.tags }}<span class="tag">{{ . }}</span>{{ end }}
  </div>
</a>
