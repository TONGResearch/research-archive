baseURL: "https://tongresearch.github.io/research-archive/"
languageCode: "en"
title: "未竟札記"
enableRobotsTXT: true
enableGitInfo: true
hasCJKLanguage: true
summaryLength: 80
timeZone: "Asia/Kuala_Lumpur"

params:
  subtitle: "Unfinished Notes"
  description: "A long-term public research archive documenting intellectual development across AI, governance, political economy, sociology, and public policy."
  author: "Jiatong"

  # Short intro shown on homepage — edit freely
  introShort: "I am a university student working at the intersection of artificial intelligence, governance, and political economy. This archive records my research, reading, and evolving understanding of technology and society."

  # GitHub — shown on GitHub Hub page
  githubProfile: "https://github.com/TONGResearch"
  githubUsername: "TONGResearch"

  # Project categories — drives Projects section nav
  projectCategories:
    - name: "AI & Agent Systems"
      slug: "ai-agent-systems"
      desc: "AI agents, multi-agent systems, RAG applications, LLM tooling"
    - name: "Research Tools"
      slug: "research-tools"
      desc: "Policy research assistants, knowledge graphs, data analysis tools"
    - name: "Experiments"
      slug: "experiments"
      desc: "Prototypes, technical explorations, and ongoing experiments"

  # Research areas — drives homepage grid and /areas/ browse pages
  researchAreas:
    - name: "Technology Governance"
      slug: "technology-governance"
    - name: "Public Policy"
      slug: "public-policy"
    - name: "Political Economy"
      slug: "political-economy"
    - name: "Sociology"
      slug: "sociology"
    - name: "Psychology"
      slug: "psychology"
    - name: "Economics"
      slug: "economics"
    - name: "Finance"
      slug: "finance"
    - name: "Marxism"
      slug: "marxism"

outputs:
  home:
    - HTML
    - RSS
    - JSON

taxonomies:
  tag: tags
  field: fields
  area: areas
  status: status

permalinks:
  posts:    "/posts/:year/:month/:slug/"
  reading:  "/reading/:year/:month/:slug/"
  research: "/research/:year/:month/:slug/"
  thoughts: "/thoughts/:year/:month/:slug/"
  policy:   "/policy/:year/:month/:slug/"
  projects: "/projects/:year/:month/:slug/"

# Primary nav — 7 items
menu:
  main:
    - name: "Home"
      pageRef: "/"
      weight: 10
    - name: "Research"
      pageRef: "/research"
      weight: 20
    - name: "Reading"
      pageRef: "/reading"
      weight: 30
    - name: "Policy"
      pageRef: "/policy"
      weight: 40
    - name: "Projects"
      pageRef: "/projects"
      weight: 45
    - name: "Archive"
      pageRef: "/archive"
      weight: 50
    - name: "About"
      pageRef: "/about"
      weight: 60

caches:
  images:
    dir: :cacheDir/images

markup:
  goldmark:
    renderer:
      unsafe: false
  highlight:
    noClasses: false
